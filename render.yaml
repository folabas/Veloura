# Render Blueprint for the Veloura content API and admin panel.
# Render → New → Blueprint → pick this repo. You'll be asked for the values marked sync: false.
services:
  - type: web
    name: veloura-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: veloura
      - key: ADMIN_USERNAME
        value: lewa
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: FRONTEND_REVALIDATE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
